# Construit l'APK Android de السياگ - SYAG a partir de index.html.
# Se lance tout seul a chaque modification de index.html, ou a la main
# (onglet Actions > Build APK > Run workflow). L'APK apparait dans Releases.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'icon-512.png', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Copier les fichiers du jeu
        run: |
          mkdir -p build/www
          cp index.html build/www/
          for f in sw.js manifest.webmanifest *.png; do [ -f "$f" ] && cp "$f" build/www/ || true; done

      - name: Creer le projet Android
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "السياگ" com.rainlb.syag --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icone et ecran de demarrage
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          res = 'build/android/app/src/main/res'
          src = Image.open('icon-512.png').convert('RGBA')
          for d in glob.glob(res + '/mipmap-anydpi-v26'):
              for f in glob.glob(d + '/*'):
                  os.remove(f)
              os.rmdir(d)
          for f in glob.glob(res + '/mipmap-*/ic_launcher*.png'):
              w, h = Image.open(f).size
              im = src.resize((w, h), Image.LANCZOS)
              if f.endswith('_round.png'):
                  m = Image.new('L', (w, h), 0)
                  ImageDraw.Draw(m).ellipse((0, 0, w - 1, h - 1), fill=255)
                  im.putalpha(m)
              im.save(f)
          for f in glob.glob(res + '/drawable*/splash.png'):
              w, h = Image.open(f).size
              bg = Image.new('RGBA', (w, h), (70, 112, 58, 255))
              s = int(min(w, h) * 0.42)
              bg.alpha_composite(src.resize((s, s), Image.LANCZOS), ((w - s) // 2, (h - s) // 2))
              bg.convert('RGB').save(f)
          PY

      - name: Numero de version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build/android/app/build.gradle
          grep -n "versionCode\|versionName" build/android/app/build.gradle

      - name: Cle de signature (toujours la meme, pour pouvoir mettre a jour l'appli)
        run: |
          echo "" | base64 -d > build/android/app/syag.keystore
          python3 - <<'PY'
          p = 'build/android/app/build.gradle'
          s = open(p).read()
          cfg = """    signingConfigs {
                  debug {
                      storeFile file('syag.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          s = s.replace('android {\n', 'android {\n' + cfg, 1)
          open(p, 'w').write(s)
          PY
          grep -n -A6 "signingConfigs" build/android/app/build.gradle

      - name: Construire l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SYAG.apk
          keytool -printcert -jarfile ../../SYAG.apk | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: SYAG-apk
          path: SYAG.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "السياگ - SYAG (APK ${{ github.run_number }})"
          body: "Telecharge SYAG.apk ci-dessous et ouvre-le sur ton telephone Android."
          files: SYAG.apk
